# NEU TV on a VPS.
#
#   docker compose up -d
#
# Four containers: the API, its database, a media server for RTMP, and Caddy in
# front doing TLS. Only Caddy and the RTMP port are published; the API, Postgres
# and the HLS port are reachable only from inside the compose network.
#
# TLS is not optional here. The viewer app and the back office are served from
# Vercel over https, and a browser refuses to call an http:// API from an https
# page - the request is blocked before it is sent, which surfaces as "Failed to
# fetch" and looks exactly like the backend being down.
#
# Copy deploy/.env.example to .env and fill it in first.

name: neutv

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 4173
      NEUTV_DATA_DIR: /data
      DATABASE_URL: postgres://neutv:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/neutv
      NEUTV_ADMIN_EMAILS: ${NEUTV_ADMIN_EMAILS:?set NEUTV_ADMIN_EMAILS or nobody can reach the back office}
      # Video: Cloudinary stores and transcodes, the CDN serves.
      NEUTV_MEDIA_DRIVER: ${NEUTV_MEDIA_DRIVER:-cloudinary}
      NEUTV_CLOUDINARY_CLOUD_NAME: ${NEUTV_CLOUDINARY_CLOUD_NAME:-}
      NEUTV_CLOUDINARY_API_KEY: ${NEUTV_CLOUDINARY_API_KEY:-}
      NEUTV_CLOUDINARY_API_SECRET: ${NEUTV_CLOUDINARY_API_SECRET:-}
      NEUTV_CLOUDINARY_FOLDER: ${NEUTV_CLOUDINARY_FOLDER:-videos}
      # Where players fetch video. Fastly in front of Cloudinary.
      NEUTV_MEDIA_BASE_URL: ${NEUTV_MEDIA_BASE_URL:-}
      # Live: OBS publishes RTMP to MediaMTX, viewers get HLS through Caddy.
      NEUTV_LIVE_DRIVER: ${NEUTV_LIVE_DRIVER:-mediamtx}
      NEUTV_MEDIAMTX_RTMP_URL: rtmp://${API_DOMAIN:?set API_DOMAIN}:1935
      NEUTV_MEDIAMTX_HLS_BASE: https://${API_DOMAIN}/hls
    volumes:
      # Live broadcast segments. The only state that is not in Postgres or
      # Cloudinary, and it has to outlive the container.
      - segments:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only. Not reachable from the internet - whatever terminates
      # TLS (the caddy service below, or a Caddy already installed on the host)
      # reaches it here.
      - "127.0.0.1:4173:4173"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neutv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: neutv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API runs its migrations on boot, so it must not start against a
      # database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U neutv -d neutv"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "5432"

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      MTX_PROTOCOLS: tcp
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # RTMP is published directly: OBS speaks RTMP, not HTTP, so Caddy cannot
      # proxy it. It is plain RTMP, so the stream key is the only thing
      # protecting the broadcast - which is why the ingest driver mints a long
      # random one rather than letting anyone choose it.
      - "1935:1935"
      # HLS on loopback, for whichever proxy is serving /hls.
      - "127.0.0.1:8888:8888"

  # Only started with `--profile edge`. A VPS that already has Caddy installed
  # has something on :80 already, and two of them cannot both bind it - so the
  # default is to use the one that is there and proxy to the loopback ports
  # above. See deploy/Caddyfile.host.
  # caddy:
  #   profiles: ["edge"]
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   environment:
  #     API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
  #   volumes:
  #     - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddydata:/data
  #     - caddyconfig:/config
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - api
  #     - mediamtx

volumes:
  pgdata:
  segments:
  # caddydata:
  # caddyconfig:
