<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEU TV — The New Economy, On Screen.</title>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Tailwind, compiled ahead of time by the CLI (npm run build:css).
       This replaced cdn.tailwindcss.com, which shipped ~400KB of JavaScript to
       compile the stylesheet in the browser on every page load. -->
  <link rel="stylesheet" href="./src/app.build.css?v=2.0">

  <!-- Custom animations and glassmorphic surfaces. Loaded after Tailwind so
       these rules win. -->
  <link rel="stylesheet" href="./src/styles.css?v=2.0">
</head>
<body class="bg-[#060A12] text-white antialiased selection:bg-[#00F6A7] selection:text-black min-h-screen">

  <div id="root">
    <!-- Initial Loading State matching Brand Guide -->
    <div class="h-screen w-screen flex flex-col items-center justify-center bg-[#060A12] text-white space-y-4">
      <div class="w-14 h-14 rounded-2xl bg-[#0B1220] border border-[#00F6A7]/40 shadow-[0_0_30px_rgba(0,246,167,0.25)] flex items-center justify-center animate-pulse">
        <span class="text-2xl font-black italic bg-gradient-to-r from-[#00F6A7] via-[#00C8FF] to-[#4D6BFF] bg-clip-text text-transparent">N</span>
      </div>
      <div class="text-center space-y-1">
        <div class="flex items-center justify-center gap-1">
          <span class="text-lg font-black italic tracking-tight bg-gradient-to-r from-[#00F6A7] via-[#00C8FF] to-[#4D6BFF] bg-clip-text text-transparent">NEU</span>
          <span class="text-xs font-black text-[#00C8FF] -mt-1 tracking-widest">TV</span>
        </div>
        <div class="text-[10px] font-mono tracking-[0.25em] uppercase text-white/50">THE NEW ECONOMY, ON SCREEN.</div>
      </div>
    </div>
  </div>

  <!-- Where the API lives. Generated at build time from NEUTV_API_BASE; empty
       when the gateway serves this page itself, so the API is same-origin.
       Must load before the client reads it. -->
  <script src="./src/config.js?v=2.0"></script>

  <!-- The app. There is no bundled catalog: every product, hub, shelf and
       video on this page arrives from the API through hydrate() below.

       bridge.js must load before app.js: app.js reads window.NeuTVBridge once,
       at the top of its IIFE, and falls back to a no-op stub if it is missing.
       It was missing - the tag was never added - so all 18 of its API calls
       (wallet, likes, comments, tips, and adopting the stage an admin put on
       air) resolved to null and the page ran entirely on local state. -->
  <script src="./src/bridge.js?v=2.0"></script>
  <script src="./src/catalog.js?v=2.0"></script>
  <script src="./src/app.js?v=2.0"></script>

  <!-- NEU TV backend client (contract v2) -->
  <script src="./src/segment-player.js?v=1.0"></script>
  <script src="./src/neutv-api.js?v=2.0"></script>

  <!-- Mount Script -->
  <script>
    function initApp() {
      const rootElement = document.getElementById('root');
      if (rootElement && window.CentralApp && window.React && window.ReactDOM) {
        try {
          const root = ReactDOM.createRoot(rootElement);
          root.render(React.createElement(window.CentralApp));
        } catch(err) {
          console.error("Mount error:", err);
        }
      }
    }

    // The page has no content of its own any more, so a failure to reach the
    // API is a real failure and says so. It used to fall back to a catalog
    // bundled into the page, which meant a dead backend looked exactly like a
    // healthy one and nobody noticed for as long as the fixtures stayed
    // plausible.
    // Two audiences, one failure.
    //
    // A viewer gets an apology and a retry button. They cannot start a server,
    // they do not know what an API is, and "Failed to fetch" tells them nothing
    // - this screen used to say "run npm start", which is a developer's note
    // left on a public page.
    //
    // Whoever is actually debugging gets the detail, on localhost where the
    // instruction is true, and in the console everywhere.
    function showOffline(message) {
      var isLocal = ['localhost', '127.0.0.1', '[::1]', ''].indexOf(location.hostname) !== -1;
      if (window.console) {
        console.error('[NEU TV] the API at ' + ((window.NEUTV_API_BASE || location.origin) + '/api/v1')
          + ' could not be reached:', message || '(no detail)');
      }

      var detail = isLocal
        ? '<div class="text-sm text-white/50 max-w-md">The catalog, the library and the live stage all come from the '
          + 'backend. Start it with <span class="font-mono text-[#00F6A7]">npm start</span> and reload.</div>'
          + '<div class="text-xs font-mono text-white/30">' + escapeHtml(message || '') + '</div>'
        : '<div class="text-sm text-white/50 max-w-md">We can&rsquo;t load the broadcast right now. '
          + 'This is on our side &mdash; please try again in a moment.</div>';

      document.getElementById('root').innerHTML =
        '<div class="h-screen w-screen flex flex-col items-center justify-center bg-[#060A12] text-white gap-4 px-6 text-center">'
        + '<div class="w-14 h-14 rounded-2xl bg-[#0B1220] border border-white/10 flex items-center justify-center">'
        + '<span class="text-2xl font-black italic text-white/40">N</span></div>'
        + '<div class="text-lg font-semibold">' + (isLocal ? 'NEU TV cannot reach its API' : 'NEU TV is temporarily unavailable') + '</div>'
        + detail
        + '<button onclick="window.location.reload()" class="mt-2 px-4 py-2 rounded-lg bg-[#00F6A7] text-black text-sm font-semibold">Retry</button>'
        + '</div>';
    }

    // The message can carry a URL from a fetch failure, and it is written into
    // innerHTML.
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Pull the catalog and the published library before the first render.
    function bootstrapApp() {
      if (!window.NeuTV) return showOffline('client script failed to load');
      window.NeuTV.hydrate()
        .then(function (res) {
          if (!res.live) return showOffline(res.error);
          console.log('[NEU TV] catalog ' + res.checksum + ', ' + res.library + ' videos in the library');
          initApp();
          // Keep this viewer inside the live count while the tab is open.
          if (window.NeuTV.live) window.NeuTV.live.startPresence();
        })
        .catch(function (err) { showOffline(err && err.message); });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrapApp);
    } else {
      bootstrapApp();
    }

    // Refresh Lucide icons dynamically
    setInterval(function() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }, 1000);
  </script>
</body>
</html>
